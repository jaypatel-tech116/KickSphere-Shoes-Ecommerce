<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Small_Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    
    <!-- Primary Meta Tags -->
    <title>KickSphere | Step Into Excellence</title>
    <meta name="title" content="KickSphere | Step Into Excellence" />
    <meta name="description" content="Elevate your sneaker game with KickSphere. Discover premium footwear, exclusive drops, and timeless classics for the modern enthusiast." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kicksphere-client.vercel.app/" />
    <meta property="og:title" content="KickSphere | Step Into Excellence" />
    <meta property="og:description" content="Elevate your sneaker game with KickSphere. Discover premium footwear, exclusive drops, and timeless classics." />
    <meta property="og:image" content="/Small_Logo.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://kicksphere-client.vercel.app/" />
    <meta property="twitter:title" content="KickSphere | Step Into Excellence" />
    <meta property="twitter:description" content="Elevate your sneaker game with KickSphere. Discover premium footwear, exclusive drops, and timeless classics." />
    <meta property="twitter:image" content="/Small_Logo.png" />

    <!-- Preconnect Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
      :root {
        --primary: #E8000D;
        --bg: #000000;
      }
      
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg);
        overflow-x: hidden;
      }

      #loader-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .loader-logo {
        width: 60px;
        height: auto;
        filter: drop-shadow(0 0 10px rgba(232, 0, 13, 0.3));
        animation: logo-pulse 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
      }

      .loader-bar {
        width: 120px;
        height: 2px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        position: relative;
        overflow: hidden;
      }

      .loader-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 30%;
        background: var(--primary);
        border-radius: 2px;
        animation: bar-slide 1.5s infinite ease-in-out;
      }

      @keyframes logo-pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 20px rgba(232, 0, 13, 0.6)); }
      }

      @keyframes bar-slide {
        0% { left: -30%; }
        100% { left: 100%; }
      }

      #root {
        opacity: 0;
        transition: opacity 0.8s ease-in-out;
      }

      body.loaded #root {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="loader-wrapper">
      <div class="loader-content">
        <img src="/Small_Logo.png" alt="KickSphere" class="loader-logo" />
        <div class="loader-bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Force initial load check
      window.addEventListener('load', () => {
        const loader = document.getElementById('loader-wrapper');
        const root = document.getElementById('root');
        
        if (loader) {
          loader.style.opacity = '0';
          document.body.classList.add('loaded');
          
          setTimeout(() => {
            loader.style.display = 'none';
          }, 500);
        }
      });

      // Backup timeout to hide loader if app takes too long
      setTimeout(() => {
        const loader = document.getElementById('loader-wrapper');
        if (loader && loader.style.display !== 'none') {
          loader.style.opacity = '0';
          document.body.classList.add('loaded');
          setTimeout(() => {
            loader.style.display = 'none';
          }, 500);
        }
      }, 3000);
    </script>
  </body>
</html>
